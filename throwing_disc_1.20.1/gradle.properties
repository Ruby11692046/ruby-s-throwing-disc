mod_description=Adds the Throwing Disc - the returning ranged weapon announced for Minecraft's first 2027 game drop - to 1.20.1. Throw it and it flies straight, pierces lined-up enemies, ricochets off solid blocks (each bounce reaches farther and faster), then returns to the hand that threw it. Five vanilla tiers (copper, iron, gold, diamond, netherite) plus discs made from Twilight Forest, The Aether, Create, Mekanism, Deeper and Darker, L_Ender's Cataclysm and Ice and Fire materials. Every integration is a soft dependency, and each disc keeps its home material's weapon traits: gravitite launches foes skyward, zanite grows stronger as it wears, silver bites the undead, and more. Textures by Ruby.
